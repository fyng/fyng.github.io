name: Preview site

# Builds non-master branches and publishes them to https://fyng.github.io/preview/
# without touching the live site at the root of gh-pages.
on:
  push:
    branches-ignore:
      - master
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps
        run: npm ci
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build --baseurl /preview
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy to gh-pages/preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          target-folder: preview
          clean: true
