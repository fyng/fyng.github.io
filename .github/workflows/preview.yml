name: Preview site

# Builds non-master branches and publishes them to https://fyng.github.io/preview/
# without touching the live site at the root of gh-pages.
on:
  push:
    branches-ignore:
      - master
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps
        run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Render CV PDF (RenderCV)
        run: |
          python3 -m pip install --quiet "rendercv[full]"
          cd _data && rendercv render cv.yml -s ../assets/rendercv/settings.yaml -d ../assets/rendercv/design.yaml -lc ../assets/rendercv/locale.yaml
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          # noindex keeps search engines from treating /preview/ as a duplicate of the live site
          printf 'noindex: true\n' > _config_preview.yml
          bundle exec jekyll build --baseurl /preview --config _config.yml,_config_preview.yml
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy to gh-pages/preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          target-folder: preview
          clean: true
