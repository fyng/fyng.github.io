<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precision Safety — graphical abstract</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit/ga-kit.css">
<script src="kit/icons.js"></script>
<script src="kit/ga-kit.js"></script>
<script src="kit/ga-charts.js"></script>
</head>
<body>
<script>
GA.build({
  duration: 16, poster: 15,
  title: "Precision safety in oncology",
  desc: "An LLM extracts the incidence, timing and grade of adverse events from clinical notes of over 50,000 patients (MSK-Tox). A machine learning model integrates pretreatment clinical and demographic risk factors specific to each adverse event. In 35,669 patients with germline sequencing, HLA-DRB1*15 predicts immune-related adrenal insufficiency on immune checkpoint inhibitors. Precision safety should complement response prediction in personalized medicine.",
}, (ga) => {
  const ORGAN = { lungs: "var(--organ-lungs)", colon: "var(--organ-colon)", liver: "var(--organ-liver)", thyroid: "var(--organ-thyroid)", adrenal: "var(--organ-adrenal)" };
  const NAME = { lungs: "lung", colon: "colon", liver: "liver", thyroid: "thyroid", adrenal: "adrenal" };

  // ---------------- header ----------------
  const hd = ga.stack(ga.M, 44, { w: 1400 });
  hd.text("PRECISION SAFETY · MEDRXIV 2026", { role: "kicker", at: 0.1, gap: 14 });
  hd.text("Can we predict individual adverse event risk from cancer therapy\nusing information at the point of treatment decision?", { role: "title", at: 0.1 });

  // no dividers: the gutters separate the panels
  const [c1, c2, c3] = ga.columns(3, { top: 204, bottom: 766, dividers: false });
  // panel header: number and title, nothing else
  const header = (c, num, head, at) => {
    const n = ga.text(num, { x: c.x0, y: c.top, role: "head", color: "var(--prussian)", at });
    ga.text(head, { x: n.r + 14, y: c.top, role: "head", at });
    return c.top + 74;
  };
  const conclusion = (c, str, at) => ga.text(str, { x: c.x0, y: c.bottom - 50, w: c.w, role: "body", at });
  // Method box: wash fill, prussian icon over a short label (the same for every method)
  const method = (x, y, icon, label, at) => {
    const box = ga.rect({ x, y, w: 112, h: 92, fill: "var(--benefit-wash)", at });
    ga.icon(icon, { cx: box.cx, cy: box.t + 35, size: 44, color: "var(--prussian)", at });
    ga.text(label, { x: box.cx, y: box.b - 28, anchor: "middle", role: "tick", weight: 500, color: "var(--prussian)", at, anim: "pop" });
    return box;
  };
  // Lamina bar: rounded 4px at the data end only, square at the baseline
  const bar = (x, y, w, h, fill, at) =>
    ga.raw(`<path d="M${x} ${y}h${w - 4}a4 4 0 0 1 4 4v${h - 8}a4 4 0 0 1 -4 4h${-(w - 4)}Z" fill="${fill}"/>`, { at, anim: "grow", t: 0.7 });

  // ---------------- 01 · MSK-Tox ----------------
  let y = header(c1, "01", "MSK-Tox", 0.8);
  const rowY = y + 56;
  ga.icon("note", { cx: c1.x0 + 58, cy: rowY - 12, size: 80, color: "var(--ink)", at: 1.1, anim: "in", lint: false });
  ga.icon("note", { cx: c1.x0 + 50, cy: rowY - 4, size: 80, color: "var(--ink)", at: 1.25, anim: "in", lint: false });
  const notes = ga.icon("note", { cx: c1.x0 + 42, cy: rowY + 4, size: 80, color: "var(--ink)", at: 1.4, anim: "in" });
  const llm = method(c1.x0 + 166, rowY - 46, "llm", "LLM", 2.1);
  const outs = ga.text("incidence\ntiming\ngrade", { x: llm.r + 76, y: rowY - 36, role: "label", at: 2.5 });
  ga.connect(notes, llm, { at: 1.8 });
  ga.connect(llm, outs, { at: 2.4 });

  // legend: registered organ colours, icon + name
  const legY = rowY + 74;
  let lx = c1.x0;
  for (const k of Object.keys(ORGAN)) {
    const ic = ga.icon(k, { cx: lx + 13, cy: legY, size: 28, color: ORGAN[k], at: 2.9, anim: "in" });
    const tx = ga.text(NAME[k], { x: ic.r + 6, y: legY - 10, role: "cap", color: "var(--ink-2)", at: 2.9 });
    lx = tx.r + 20;
  }

  // patient timelines: one hairline per patient; icon size = grade
  const tl = { x0: c1.x0, x1: c1.x1, y0: legY + 76, dy: 30, n: 5 };
  const startX = tl.x0 + 40;
  ga.text("Patients · icon size = grade", { x: tl.x0, y: tl.y0 - 40, role: "axis", at: 3.2, anim: "fade" });
  let rows = "";
  for (let i = 0; i < tl.n; i++) rows += `<path d="M${tl.x0} ${tl.y0 + i * tl.dy}H${tl.x1}" stroke="var(--rule)" stroke-width="1.5"/>`;
  rows += `<path d="M${startX} ${tl.y0 - 14}V${tl.y0 + (tl.n - 1) * tl.dy + 10}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/>`;
  ga.raw(rows, { at: 3.2, t: 0.4 });
  const axisY = tl.y0 + (tl.n - 1) * tl.dy + 14;
  ga.text("therapy start", { x: startX, y: axisY, anchor: "middle", role: "tick", at: 3.2, anim: "fade" });
  ga.text("Time", { x: tl.x1, y: axisY, anchor: "end", role: "axis", at: 3.2, anim: "fade" });
  const events = [[0, "lungs", 0.42, 32], [1, "colon", 0.26, 22], [1, "liver", 0.78, 32], [2, "thyroid", 0.6, 22], [3, "adrenal", 0.9, 28], [4, "colon", 0.2, 30], [4, "thyroid", 0.5, 20]];
  events.forEach(([row, k, f, size], i) =>
    ga.icon(k, { cx: startX + 20 + f * (tl.x1 - startX - 40), cy: tl.y0 + row * tl.dy, size, color: ORGAN[k], at: 3.6 + i * 0.08 }));
  conclusion(c1, "LLM extraction yields adverse event incidence, timing and grade in over 50,000 patients", 4.4);

  // ---------------- 02 · Clinical risk ----------------
  y = header(c2, "02", "Clinical risk", 5.0);
  const pA = ga.icon("person", { cx: c2.x0 + 30, cy: y + 124, size: 58, at: 5.4, anim: "in" });
  const pB = ga.icon("person", { cx: c2.x0 + 30, cy: y + 320, size: 58, at: 5.4, anim: "in" });
  ga.text("PT A", { x: pA.cx, y: pA.b + 6, anchor: "middle", role: "tag", at: 5.4 });
  ga.text("PT B", { x: pB.cx, y: pB.b + 6, anchor: "middle", role: "tag", at: 5.4 });
  ga.text("lung cancer · immunotherapy\nage 71 · COPD", { x: pA.r + 16, y: pA.t - 56, role: "label", size: 15, at: 5.7 });
  ga.text("melanoma · combination ICI\nage 48 · history of IBD", { x: pB.r + 16, y: pB.b + 4, role: "label", size: 15, at: 5.7 });

  const rf = method(c2.x0 + 146, (pA.cy + pB.cy) / 2 - 46, "network", "ML model", 6.3);
  ga.connect(pA, rf, { toAt: 0.3, at: 6.0 });
  ga.connect(pB, rf, { toAt: 0.7, at: 6.0 });

  // predicted risk per adverse event: bars in the organ's registered colour
  const profile = (top, vals, at, title) => {
    const bx = c2.x1 - 84, its = [];
    if (title) its.push(ga.text("Predicted risk", { x: bx - 26, y: top - 32, role: "axis", at, anim: "fade" }));
    ["lungs", "colon", "liver", "thyroid"].forEach((k, i) => {
      its.push(ga.icon(k, { cx: bx - 12, cy: top + 8 + i * 26, size: 22, color: ORGAN[k], at, anim: "in" }));
      bar(bx + 4, top + 1 + i * 26, Math.max(8, vals[i] * 80), 14, ORGAN[k], at + 0.2 + i * 0.08);
    });
    return ga.union(...its.slice(title ? 1 : 0));
  };
  const rA = profile(pA.cy - 70, [0.85, 0.12, 0.25, 0.18], 6.9, true);
  const rB = profile(pB.cy - 50, [0.14, 0.88, 0.38, 0.55], 7.3);
  ga.connect(rf, rA, { fromAt: 0.3, at: 6.7 });
  ga.connect(rf, rB, { fromAt: 0.7, at: 6.7 });
  conclusion(c2, "Machine learning integrates pretreatment clinical and demographic risk factors specific to each adverse event", 8.2);

  // ---------------- 03 · Germline risk ----------------
  y = header(c3, "03", "Germline risk", 9.0);
  const gy = y + 58;
  const dna = ga.icon("dna", { cx: c3.x0 + 22, cy: gy, size: 58, color: "var(--prussian)", at: 9.4, anim: "in" });
  const hla = ga.pill("HLA-DRB1*15", { x: dna.r + 14, cy: gy, role: "tag", size: 16, padX: 18, h: 44, fill: "var(--accent-wash)", color: "var(--accent-text)", at: 9.8 });
  const adr = ga.icon("adrenal", { cx: hla.r + 100, cy: gy, size: 52, color: ORGAN.adrenal, at: 10.4 });
  const ai = ga.connect(hla, adr, { color: "var(--harm)", straight: true, at: 10.1 });
  ga.text("ICI", { x: ai.cx, y: ai.t - 30, anchor: "middle", role: "tick", at: 10.2 });
  ga.text("adrenal\ninsufficiency", { x: adr.r + 10, y: gy - 21, role: "label", size: 15, at: 10.5 });

  // schematic cumulative incidence: shape only, no values implied
  const ch = GA.chart(ga, { x: c3.x0, y: gy + 92, w: c3.w - 104, h: 196, xd: [0, 7.5], yd: [0, 1], yTitle: "Cumulative incidence (schematic)", xTitle: "Time on ICI", at: 10.8 });
  const steps = (ys) => [...ys.map((v, i) => [i, v]), [7.5, ys.at(-1)]];
  const car = steps([0, 0.06, 0.16, 0.32, 0.5, 0.64, 0.74, 0.8]), non = steps([0, 0.01, 0.03, 0.05, 0.07, 0.1, 0.12, 0.13]);
  ch.line(non, { curve: "step", color: "var(--context)", at: 11.2 });
  ch.line(car, { curve: "step", color: "var(--harm)", at: 11.2 });
  ch.label("carriers", 7.5, 0.8, { dx: 10, color: "var(--harm-text)", at: 12.3 });
  ch.label("non-carriers", 7.5, 0.13, { dx: 10, color: "var(--muted)", at: 12.3 });
  conclusion(c3, "In 35,669 patients, germline variants predict propensity for immune-related adrenal insufficiency", 12.8);

  // ---------------- take-home ----------------
  ga.text("A precision safety paradigm is needed to complement response prediction in personalized medicine.", { x: ga.M, y: 816, w: 1472, role: "take", at: 13.4 });
});
</script>
</body>
</html>
