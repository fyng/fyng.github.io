<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STdeconvolve — graphical abstract</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design-system/formats/abstract/kit/ga-kit.css">
<script src="../design-system/formats/abstract/kit/icons.js"></script>
<script src="../design-system/formats/abstract/kit/ga-kit.js"></script>
<script src="../design-system/formats/abstract/kit/ga-bio.js"></script>
</head>
<body>
<script>
GA.build({
  title: "STdeconvolve: reference-free cell-type deconvolution",
  desc: "Spatial transcriptomics technologies such as Spatial Transcriptomics, 10X Visium, DBiT-seq and Slide-seq measure gene expression in spots that each contain several cells, which hinders identifying cell-type-specific spatial patterns. STdeconvolve models spots as documents and cell types as topics with latent Dirichlet allocation, and recovers each cell type's transcriptional profile (beta) and its proportion in every spot (theta), without a single-cell reference. Schematic maps show four deconvolved cell types in layers of a two-lobed tissue section. STdeconvolve performs comparably to reference-based methods when suitable references exist, and potentially better when they do not.",
}, (ga) => {
  const B = GA.bio(ga);
  // Motion is paced by reading: each graphic enters as one scene, arrows draw the
  // flow from input to output, and every title and conclusion holds for its reading time.
  const T = ga.timeline();

  // ---------------- header ----------------
  const TITLE = "Spot-based spatial transcriptomics cell-type deconvolution\nwithout a single-cell reference";
  ga.scene(T.read(TITLE), () => {
    const hd = ga.stack(ga.M, 44, { w: 1400 });
    hd.text("STDECONVOLVE · NATURE COMMUNICATIONS 2022", { role: "kicker", gap: 14 });
    hd.text(TITLE, { role: "title" });
  }, { anim: "in" });

  // no dividers: the gutters separate the panels
  const [c1, c2, c3] = ga.columns(3, { top: 204, bottom: 766, dividers: false });
  // panel header: number and title, entering with the panel's input
  const header = (c, num, head) => ga.scene(T.now, () => {
    const n = ga.text(num, { x: c.x0, y: c.top, role: "head", color: "var(--prussian)" });
    ga.text(head, { x: n.r + 14, y: c.top, w: c.x1 - n.r - 14, role: "head" }); // wraps to two lines at most
    return c.top + 104; // content starts below a two-line header in every panel
  }, { anim: "in" });
  const conclusion = (c, str) => ga.text(str, { x: c.x0, y: c.bottom - 50, w: c.w, role: "body", at: T.read(str) });

  // Schematic layers: type k peaks at radial depth PEAK[k] of each lobe (1 = core).
  // Shares are normalised per spot, so every spot is a mixture that sums to one.
  const PEAK = [0.12, 0.45, 0.68, 0.9], WID = [0.2, 0.12, 0.1, 0.1];
  const share = (s) => {
    const raw = PEAK.map((p, k) => Math.exp(-(((s.rho - p) / WID[k]) ** 2) / 2) + 0.02);
    const tot = raw.reduce((a, b) => a + b, 0);
    return raw.map((v) => v / tot);
  };

  // ---------------- 01 · Data ----------------
  let y = header(c1, "01", "Spot-based ST technologies");
  // the section and its spots are one graphic
  const tis = ga.scene(T.next(0.5), () => {
    const tis = B.tissue({ cx: c1.x0 + 108, cy: y + 104, w: 216, h: 172, pitch: 17 });
    B.spots(tis);
    return tis;
  });
  // the spot we zoom into: a mixed spot on the right lobe
  const px = tis.spots.filter((s) => s.x > tis.cx + 40 && s.rho > 0.5 && s.rho < 0.62).sort((a, b) => a.y - b.y)[0];
  B.zoom({
    src: px, cx: c1.x1 - 84, cy: y + 96, R: 80, at: T.next(1.2),
    cells: [[-34, -30, 21, 3], [16, -40, 18, 2], [38, 4, 22, 4], [-4, 8, 20, 2], [-42, 22, 17, 1], [8, 50, 18, 3]],
  });

  // measured expression: spots (rows) x genes (columns); the zoomed spot is one row
  // that spot becomes one row of the measured matrix: frame first, then its values
  const my = y + 262, mAt = T.next(0.4), fAt = T.next(0.8);
  const ring = (i, cx, cy) => `<circle cx="${cx}" cy="${cy}" r="5.5" fill="var(--paper)" stroke="${i === 1 ? "var(--ink)" : "var(--context)"}" stroke-width="${i === 1 ? 2 : 1.2}"/>`;
  const vals = [0.35, 0.8, 0.15, 0.55, 0.95, 0.25, 0.6, 0.1, 0.7, 0.4];
  const mx = B.matrix({
    x: c1.x0 + 90, y: my, rows: 5, cols: 10, cell: 18, at: mAt, rowGlyph: ring,
    fill: (i, j) => (i === 1 ? { color: "var(--quantity)", opacity: 0.15 + 0.85 * vals[j] } : null), fillAt: fAt, stagger: 0,
  });
  B.brace({ side: "left", x: c1.x0 + 64, y0: mx.t, y1: mx.b, label: "D", at: mAt });
  B.brace({ side: "bottom", x0: mx.l, x1: mx.r, y: mx.b + 6, label: "N", at: mAt });
  ga.text("spots", { x: c1.x0, y: mx.cy + 22, role: "note", at: mAt, anim: "fade" });
  ga.text("genes", { x: mx.r + 14, y: mx.b + 16, role: "note", at: mAt, anim: "fade" });
  conclusion(c1, "Spots pool several cells, hiding cell-type-specific spatial patterns");

  // ---------------- 02 · Model ----------------
  y = header(c2, "02", "Topic model infers cell-type mixture");
  // the plates and nodes are one graph; the arrows then trace how a gene is
  // generated (prior → proportions → cell type → gene, profile → gene)
  const ny = y + 244, X = [c2.x0 + 30, c2.x0 + 146, c2.x0 + 262, c2.x0 + 378];
  const [alpha, theta, z, w, beta] = ga.scene(T.next(0.6), () => {
    B.plate({ x0: X[1] - 44, y0: ny - 80, x1: c2.x1 - 4, y1: ny + 64, label: "d = 1…D" });
    B.plate({ x0: X[2] - 40, y0: ny - 56, x1: c2.x1 - 16, y1: ny + 48, label: "m = 1…M" });
    B.plate({ x0: X[3] - 96, y0: ny - 212, x1: c2.x1 - 4, y1: ny - 118, label: "k = 1…K" });
    return [
      B.node({ cx: X[0], cy: ny, label: "α" }),
      B.node({ cx: X[1], cy: ny, label: "θ_d" }),
      B.node({ cx: X[2], cy: ny, label: "z_{d,m}", size: 17 }),
      B.node({ cx: X[3], cy: ny, label: "w_{d,m}", size: 17, observed: true }),
      B.node({ cx: X[3], cy: ny - 160, label: "β_k" }),
    ];
  });
  ga.connect(alpha, theta, { at: T.next(0.3), t: 0.35, gap: 6 });
  ga.connect(theta, z, { at: T.next(0.3), t: 0.35, gap: 6 });
  const last = T.next(0.5);
  ga.connect(z, w, { at: last, t: 0.4, gap: 6 });
  ga.connect(beta, w, { from: "b", to: "t", at: last, t: 0.4, gap: 6 });
  // what each symbol means, for readers who don't speak plate notation: one layer
  const notes = T.next(0) + 0.25;
  B.note("prior", { from: alpha, x: X[0], y: ny + 92, at: notes });
  B.note("cell-type\nproportions", { from: theta, x: X[1], y: ny + 92, at: notes });
  B.note("cell type\nper molecule", { from: z, x: X[2], y: ny + 92, at: notes });
  B.note("observed\ngene", { from: w, x: X[3], y: ny + 92, at: notes });
  B.note("cell-type\ngene profile", { from: beta, fromSide: "l", toSide: "r", x: X[3] - 116, y: ny - 186, anchor: "end", at: notes });
  T.wait(0.6);
  conclusion(c2, "Latent Dirichlet allocation learns cell types from the spots alone");

  // ---------------- 03 · Output ----------------
  y = header(c3, "03", "Deconvolution recovers cell-type proportions");
  // two outputs, each one graphic: β (profiles), then θ (four maps, all at once)
  const bAt = T.next(0.4), bFill = T.next(0.8);
  // β: genes per cell type (each row in its type's colour; darker = higher)
  const by = y + 34;
  B.math("β", { x: c3.x0, y: by - 30, at: bAt });
  ga.text("expression per cell type", { x: c3.x0 + 18, y: by - 30, role: "label", at: bAt, anim: "fade" });
  const marker = (i, j) => [[0, 1, 2], [4, 5], [8, 9, 10], [12, 13]][i].includes(j) ? 0.95 : (i * 3 + j * 7) % 5 === 0 ? 0.3 : 0;
  const bm = B.matrix({
    x: c3.x0 + 40, y: by, rows: 4, cols: 16, cell: 16, at: bAt,
    rowGlyph: (i, cx, cy) => B.cellMarkup(cx - 2, cy, 7, i + 1),
    fill: (i, j) => (marker(i, j) ? { color: B.color(i + 1), opacity: marker(i, j) } : null), fillAt: bAt + 0.5, stagger: 0,
  });

  // θ: proportion of each cell type in every spot, one map per type
  const ty = bm.b + 24, tAt = T.next(1.5);
  B.math("θ", { x: c3.x0, y: ty, at: tAt });
  ga.text("proportion per spot", { x: c3.x0 + 18, y: ty, role: "label", at: tAt, anim: "fade" });
  const mw = 134, mh = 100, gx = 218;
  [0, 1, 2, 3].forEach((k) => {
    const ox = c3.x0 + 44 + (k % 2) * gx, oy = ty + 34 + Math.floor(k / 2) * (mh + 12);
    const t = B.tissue({ cx: ox + mw / 2, cy: oy + mh / 2, w: mw, h: mh, pitch: 11.5, spotR: 4.3, core: false, at: tAt });
    B.spots(t, { at: tAt, stagger: 0 });
    B.dials(t, (s) => share(s)[k], { k: k + 1, at: tAt + 0.5, spread: 0 });
    B.cell({ cx: ox - 26, cy: oy + 14, r: 9, k: k + 1, at: tAt, anim: "fade" });
    B.math(`k = ${k + 1}`, { x: ox - 26, y: oy + 30, size: 14, anchor: "middle", at: tAt });
  });
  conclusion(c3, "Recovers each cell type's transcriptional profile and its proportion in every spot");

  // ---------------- take-home ----------------
  const TAKE = "STdeconvolve performs comparably to reference-based methods without a single-cell reference.";
  ga.text(TAKE, { x: ga.M, y: 816, w: 1472, role: "take", at: T.next(1.0) }); // the final frame holds it
});
</script>
</body>
</html>
